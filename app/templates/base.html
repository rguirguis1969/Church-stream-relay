<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Relay</title>
<style>
  :root { --bg:#f5f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc;
          --accent:#2f5d50; --ok:#1f7a3a; --warn:#a15c00; --bad:#b42318; --live:#d92d20; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#21211f; --ink:#ecebe6; --muted:#a3a29c; --line:#34332f;
            --accent:#7fb8a5; --ok:#5cc77a; --warn:#e0a446; --bad:#f07a6e; --live:#ff5a4d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:19px; margin:0; }
  h3 { font-size:16px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 4px; }
  input[type=text], input[type=password], input[type=url] {
    width:100%; padding:10px 12px; font:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button, .btn { font:inherit; font-weight:600; padding:9px 16px; border-radius:8px; border:1px solid var(--accent);
                 background:var(--accent); color:var(--card); cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button.danger { background:transparent; color:var(--bad); border-color:var(--bad); }
  button.small { padding:5px 10px; font-size:14px; }
  .muted { color:var(--muted); font-size:14px; }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; border:1px solid var(--line); background:var(--card); }
  .flash.ok { border-left:4px solid var(--ok); }
  .flash.error { border-left:4px solid var(--bad); }
  .pill { display:inline-block; font-size:13px; font-weight:600; padding:2px 10px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
  .pill.live { color:var(--live); } .pill.idle { color:var(--muted); }
  .pill.sending { color:var(--ok); } .pill.ready { color:var(--accent); }
  .pill.incomplete { color:var(--warn); } .pill.off { color:var(--muted); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .copy { display:flex; gap:8px; } .copy input { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; }
  .dest { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .check { display:flex; align-items:center; gap:8px; font-weight:600; margin:0; }
  .check input { width:18px; height:18px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px;
        white-space:pre-wrap; word-break:break-all; max-height:200px; overflow:auto; margin:8px 0 0; }
  details > summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:14px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--live); margin-right:6px;
         animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
</style>
</head>
<body>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, m in messages %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>
