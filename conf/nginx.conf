# Stream relay: receives OBS on port 1935 and hands each stream to relay.py.
user www-data;
worker_processes 1;            # exec_push needs a single worker
pid /run/nginx.pid;
daemon off;
error_log /dev/stderr warn;
include /etc/nginx/modules-enabled/*.conf;

events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        notify_method post;

        application live {
            live on;
            record off;
            drop_idle_publisher 15s;

            # Only OBS with a room's secret stream key may send video.
            on_publish http://127.0.0.1:8080/hook/publish;
            on_publish_done http://127.0.0.1:8080/hook/done;

            # Nobody on the internet can watch from here; only the relay workers.
            allow play 127.0.0.1;
            deny play all;

            # One forwarder per destination. nginx restarts a forwarder a few
            # seconds after it exits, which gives automatic reconnects.
            exec_kill_signal term;
            respawn on;
            respawn_timeout 5s;
            exec_push /usr/bin/python3 /app/relay.py $name youtube;
            exec_push /usr/bin/python3 /app/relay.py $name facebook;
            exec_push /usr/bin/python3 /app/relay.py $name extra;
        }
    }
}

http {
    access_log off;
    server {
        listen 127.0.0.1:8091;
        location /stat { rtmp_stat all; }
    }
}
